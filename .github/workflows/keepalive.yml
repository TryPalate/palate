name: Keep Supabase awake
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          code=$(curl -sS -o resp.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}")
          echo "HTTP $code"
          cat resp.txt
          [ "$code" = "200" ]
