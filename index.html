<title>Palate</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Your taste, ranked. Just for your friends.">
<meta name="theme-color" content="#0A0A0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: equal-size tinted cards, one per shelf, packed tight. Artwork and names carry the page; each card's tint comes from its #1 photo. Dark-first; every colour lives in these tokens. */
:root{
  --bg:#0A0A0D; --card:#15151A; --raise:#22222A; --text:#F5F5F7; --muted:#8E8E98; --faint:#55555E; --line:rgb(255 255 255 / .08);
  --accent:#FFB06B; --scrim:rgb(0 0 0 / .62); --good:#7BD88F;
  --tint-s:38%; --tint-l:24%; --art-s:40%; --art-l:44%;
  --font:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F1F1F4; --card:#FFFFFF; --raise:#EEEEF2; --text:#111114; --muted:#6C6C75; --faint:#A8A8B0; --line:rgb(0 0 0 / .07);
    --accent:#C8641E; --scrim:rgb(10 10 14 / .4); --good:#1F8A3A;
    --tint-s:60%; --tint-l:91%; --art-s:40%; --art-l:52%; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F1F1F4; --card:#FFFFFF; --raise:#EEEEF2; --text:#111114; --muted:#6C6C75; --faint:#A8A8B0; --line:rgb(0 0 0 / .07);
  --accent:#C8641E; --scrim:rgb(10 10 14 / .4); --good:#1F8A3A;
  --tint-s:60%; --tint-l:91%; --art-s:40%; --art-l:52%; color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1200px;margin:0 auto}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{font-weight:800;font-size:30px;letter-spacing:-.055em;line-height:1;background:none;border:0;padding:0 0 4px;cursor:pointer;text-transform:lowercase}
.tabs{display:flex;gap:2px;margin-right:auto}
.tab{background:none;border:0;cursor:pointer;font-size:15px;font-weight:500;color:var(--muted);padding:7px 12px;border-radius:999px}
.tab[aria-current="page"]{color:var(--text);background:var(--raise)}
.pill{border:0;border-radius:999px;padding:9px 15px;font-weight:600;font-size:14.5px;cursor:pointer;background:var(--text);color:var(--bg);white-space:nowrap}
.pill.soft{background:var(--raise);color:var(--text)}
.pill.ghost{background:none;color:var(--muted);padding-inline:8px}
.pill.ghost:hover{color:var(--text)}
.pill.danger{color:#E5484D}
.pill.sm{padding:6px 11px;font-size:13px}
.pill:disabled{opacity:.4;cursor:default}

.bottom-nav{display:none}
@media (max-width:760px){
  .tabs,.top .pill{display:none}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px))}
  .bottom-nav button{flex:1;background:none;border:0;padding:12px 4px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .bottom-nav button[aria-current="page"]{color:var(--text)}
  .bottom-nav .add{color:var(--accent)}
  main{padding-bottom:84px}
}

/* Profile header */
.profile{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:6px 14px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.me-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;background:linear-gradient(140deg,hsl(28 70% 55%),hsl(345 55% 42%));flex:none}
.who h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1}
.who p{margin:1px 0 0;color:var(--muted);font-size:14px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--raise);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.years{display:flex;align-items:center;gap:8px;background:var(--raise);border-radius:999px;padding:4px 12px 4px 14px}
.years input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:22px;background:transparent;cursor:pointer;margin:0}
.years input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:var(--faint)}
.years input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--faint)}
.years input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);margin-top:-6.5px}
.years input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--text)}
.years output{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.note{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 14px;margin-bottom:12px;border-radius:12px;background:var(--raise);color:var(--muted);font-size:14px}

/* Shelf cards — all the same size */
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;padding-bottom:40px}
.card{border-radius:20px;padding:16px 16px 12px;min-width:0;display:flex;flex-direction:column;
  background:
    radial-gradient(120% 75% at 100% 0%, hsl(var(--h) var(--ts, var(--tint-s)) var(--tint-l)) 0%, transparent 70%),
    radial-gradient(90% 60% at 0% 100%, hsl(calc(var(--h) + 30) var(--ts, var(--tint-s)) calc(var(--tint-l) - 3%)) 0%, transparent 72%),
    var(--card)}
.card.tap{cursor:pointer;transition:transform .15s ease}
.card.tap:hover{transform:translateY(-2px)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;min-height:30px}
.card-head h2{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta{display:flex;align-items:center;gap:8px;flex:none;color:var(--muted);font-size:12.5px}
.vis{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);background:rgb(0 0 0 / .18);padding:3px 8px;border-radius:999px}
.vis svg{width:11px;height:11px}
.stack{display:flex}
.stack .av{width:22px;height:22px;font-size:9px;border:2px solid var(--card)}
.stack .av + .av{margin-left:-7px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:18px 58px minmax(0,1fr) auto;gap:10px;align-items:center;height:64px}
.row + .row{border-top:1px solid var(--line)}
.rk{font-size:17px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.row .art,.row .art-btn{justify-self:center}
.nm{min-width:0}
.nm b{display:block;font-size:16px;font-weight:600;line-height:1.2;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{display:block;font-size:13.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.empty .nm b{color:var(--faint);font-weight:500}
.ghost-art{width:52px;height:52px;border-radius:10px;border:1.5px dashed var(--line);justify-self:center}
.chg{font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chg.new{color:var(--accent)}
.also{margin:6px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.add-card{border:1.5px dashed var(--line);background:none;border-radius:20px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--muted);font-weight:600;font-size:16px}
.add-card small{font-weight:400;font-size:13.5px}
.add-card:hover{color:var(--text);border-color:var(--muted)}

/* Artwork: real photos, or a tinted placeholder until one is added */
.art{position:relative;display:grid;place-items:center;flex:none;overflow:hidden;width:var(--w);height:var(--ht);border-radius:8px;color:rgb(255 255 255 / .92);
  background:linear-gradient(150deg, hsl(var(--ah) var(--art-s) calc(var(--art-l) + 8%)), hsl(calc(var(--ah) + 28) var(--art-s) calc(var(--art-l) - 14%)));
  background-size:cover;background-position:center}
.art.photo{background-color:var(--raise)}
.art b{font-weight:700;font-size:calc(var(--ht) * .32);letter-spacing:-.03em;text-transform:uppercase}
.sh-round{border-radius:50%}
.sz-row{--w:52px;--ht:52px}.sz-row.sh-poster{--w:38px;--ht:54px}.sz-row.sh-wide{--w:58px;--ht:42px}
.sz-sm{--w:38px;--ht:38px}.sz-sm.sh-poster{--w:28px;--ht:40px}.sz-sm.sh-wide{--w:44px;--ht:32px}
.sz-lg{--w:180px;--ht:180px;border-radius:14px}.sz-lg.sh-poster{--w:140px;--ht:200px}.sz-lg.sh-wide{--w:220px;--ht:150px}.sz-lg.sh-round{border-radius:50%}
.art-btn{position:relative;background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center}
.art-btn .hint{position:absolute;inset:auto 0 -2px 0;margin:auto;width:max-content;font-size:10.5px;font-weight:700;background:var(--text);color:var(--bg);padding:1px 6px;border-radius:999px;opacity:.92}
.art-btn:hover .art{filter:brightness(1.1)}

/* Friends */
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 14px}
.head h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0}
.friends{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;padding-bottom:40px;align-items:start}
@media (max-width:820px){.friends{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:20px;padding:6px 18px}
.panel h2{font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 2px}
.friend{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;background:none;border:0;padding:13px 0;text-align:left;cursor:pointer}
.friend + .friend{border-top:1px solid var(--line)}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;background:linear-gradient(140deg,hsl(var(--h) 50% 52%),hsl(calc(var(--h) + 30) 45% 36%));flex:none}
.av.s{width:30px;height:30px;font-size:11px}
.pct{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.lately{list-style:none;margin:0;padding:0}
.lately li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:11px 0;align-items:center}
.lately li + li{border-top:1px solid var(--line)}
.lately p{margin:0;font-size:14.5px;color:var(--muted)}
.lately p b{color:var(--text);font-weight:600}

.cmp-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 16px}
.pair{display:flex}
.pair .me-av,.pair .av{width:50px;height:50px;border:3px solid var(--bg)}
.pair > :last-child{margin-left:-14px}
.cmp-top h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.15}
.cmp-top p{margin:2px 0 0;color:var(--muted)}
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:12px;padding-bottom:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 2px}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:grid;grid-template-columns:14px 44px minmax(0,1fr);gap:8px;align-items:center;height:50px}
.mini .rk{font-size:13px}
.mini .art{justify-self:center}
.mini b{font-size:14.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini li.off{opacity:.4}
.only{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:40px}
.chip{border:0;border-radius:999px;background:var(--raise);padding:8px 12px;font-size:14px;color:var(--text);cursor:pointer}

/* Recap stories */
.stories{display:grid;grid-auto-flow:column;grid-auto-columns:min(330px, 84%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}
.story{scroll-snap-align:start;aspect-ratio:9/16;max-width:100%;display:flex;flex-direction:column;gap:12px;overflow:hidden;padding:20px}
.story .tag{display:flex;justify-content:space-between;font-weight:800;font-size:16px;letter-spacing:-.04em}
.story .tag span{color:var(--muted);font-weight:500;letter-spacing:0;font-size:14px}
.story h2{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:6px 0 0;line-height:1.15}
.feature{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.feature b{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.feature span{color:var(--muted);font-size:15px}
.recap-foot{display:flex;gap:10px;flex-wrap:wrap;padding-block:4px 40px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;justify-content:center;align-items:center;padding:24px}
.sheet{background:var(--card);color:var(--text);width:min(620px,100%);max-height:calc(100dvh - 48px);overflow:auto;border-radius:24px;padding:20px 22px 0;overscroll-behavior:contain}
@media (max-width:640px){
  .scrim{align-items:flex-end;padding:0}
  .sheet{max-height:94dvh;border-radius:24px 24px 0 0;padding:16px max(16px, env(safe-area-inset-left,0px)) 0 max(16px, env(safe-area-inset-right,0px))}
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
.sheet-head h2{font-size:24px;font-weight:700;letter-spacing:-.03em;margin:0}
.sheet-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.x{background:var(--raise);border:0;width:34px;height:34px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;flex:none;color:var(--muted)}
.sheet-foot{position:sticky;bottom:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:14px}
.foot-right{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.detail .row{height:auto;min-height:64px;padding:8px 0;align-items:start}
.detail .rk{padding-top:15px}
.detail .nm b,.detail .nm span{white-space:normal}
.detail .why{margin:6px 0 0;font-size:15px;line-height:1.45;opacity:.85}
.also-fr{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fr-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);background:var(--raise);border-radius:999px;padding:2px 8px 2px 2px}
.fr-tag .av{width:18px;height:18px;font-size:8px;border:0}

.search input{width:100%;font-size:17px;padding:12px 16px;background:var(--raise);color:var(--text);border:1px solid transparent;border-radius:14px}
.search input:focus{outline:none;border-color:var(--muted)}
.results{list-style:none;margin:6px 0 0;padding:0}
.results:empty{display:none}
.results .sec{font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 8px 2px}
.res{width:100%;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;background:none;border:0;border-radius:12px;padding:7px 8px;text-align:left;cursor:pointer}
.res:hover,.res:focus-visible{background:var(--raise)}
.res .art{justify-self:center}
.res mark{background:none;color:var(--accent);font-weight:700}
.res .add{font-size:13px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px}
.res .stack .av{border-color:var(--card)}
.plus{width:38px;height:38px;border-radius:10px;border:1.5px dashed var(--faint);display:grid;place-items:center;color:var(--muted);justify-self:center}
.label{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:15px;font-weight:600;margin:18px 0 2px}
.label span{font-size:13px;font-weight:400;color:var(--muted)}
.slot{display:grid;grid-template-columns:18px 58px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.slot[draggable="true"]{cursor:grab}
.slot.over{box-shadow:inset 0 2px 0 var(--accent)}
.slot.empty{grid-template-columns:18px minmax(0,1fr);color:var(--faint);font-size:14.5px;min-height:56px}
.slot .linkish{background:none;border:0;padding:0;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline}
.ctl{display:flex;gap:2px}
.ib{width:32px;height:32px;border-radius:50%;background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px}
.ib:hover:not(:disabled){background:var(--raise);color:var(--text)}
.ib:disabled{opacity:.25;cursor:default}
.why-in{grid-column:3 / -1;width:100%;font-size:14.5px;line-height:1.4;padding:8px 12px;background:var(--raise);color:var(--text);border:1px solid transparent;border-radius:12px;resize:vertical;min-height:40px}
.why-in::placeholder{color:var(--faint)}
.why-in:focus{outline:none;border-color:var(--muted)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tipline{font-size:13.5px;color:var(--muted);margin:8px 0 0}

.pk-group{margin-top:16px}
.pk-group h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
.pk-grid{display:flex;flex-wrap:wrap;gap:7px}
.pk{border:0;border-radius:999px;background:var(--raise);padding:9px 14px;font-size:15px;font-weight:500;cursor:pointer}
.pk:hover:not(:disabled){background:var(--text);color:var(--bg)}
.pk:disabled{opacity:.35;cursor:default}
.quick{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--raise);border-radius:16px;padding:14px 16px;margin-top:12px}
.quick b{display:block;font-size:16px}
.quick span{color:var(--muted);font-size:13.5px}

.manage{list-style:none;margin:0;padding:0}
.manage li{display:grid;grid-template-columns:30px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px 8px 0;border-top:1px solid var(--line);background:var(--card)}
.manage .art{justify-self:center}
/* Drag handles: pointer events, so it works with mouse and touch */
.grip{width:30px;height:40px;display:grid;place-items:center;background:none;border:0;color:var(--faint);cursor:grab;touch-action:none;border-radius:8px;padding:0}
.grip:hover,.grip:focus-visible{color:var(--text)}
.grip svg{width:14px;height:18px}
.dz-item.lifting{background:var(--raise);box-shadow:0 10px 28px rgb(0 0 0 / .35);border-radius:12px;position:relative;z-index:3;cursor:grabbing}
.dz-item.lifting .grip{cursor:grabbing;color:var(--text)}
body.dragging{user-select:none;-webkit-user-select:none}
.manage select{background:var(--raise);border:0;border-radius:10px;padding:8px 10px;font-size:14px}

.foot{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-block:4px 24px;font-size:13px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);font-size:14px;font-weight:500;padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px)}
@media (max-width:760px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Sign-in + invite */
body:not(.in) header.top, body:not(.in) footer, body:not(.in) .bottom-nav{display:none}
.auth{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.auth .logo{font-size:56px;cursor:default;text-align:left;margin:0}
.auth p.tag{color:var(--muted);margin:-6px 0 6px}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);font-weight:500}
.auth input{font-size:17px;padding:12px 14px;background:var(--raise);color:var(--text);border:1px solid transparent;border-radius:14px}
.auth input:focus{outline:none;border-color:var(--muted)}
.auth .pill{padding:13px 16px;font-size:16px}
.auth-err{min-height:1.2em;margin:0;color:#E5484D;font-size:14px}
.auth-ok{margin:0;color:var(--good);font-size:14px}
.auth .swap{background:none;border:0;color:var(--muted);cursor:pointer;text-align:left;padding:4px 0;text-decoration:underline;font-size:14.5px}
.auth .invited{background:var(--raise);border-radius:12px;padding:10px 14px;font-size:14.5px}
.invite{padding-bottom:16px}
.invite p{margin:4px 0 10px;font-size:14px}
.link-row{display:flex;gap:8px}
.link-row input{flex:1;min-width:0;font-size:14px;padding:9px 12px;background:var(--raise);border:0;border-radius:12px}
.invite .swap{background:none;border:0;padding:10px 0 0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
.cmp-actions{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.empty-note{padding:18px 4px;color:var(--muted);font-size:15px}
.credit{margin:0 0 28px;font-size:12px;color:var(--faint)}
</style>

<header class="top">
  <div class="wrap gutter">
    <button class="logo" data-act="tab" data-tab="me" aria-label="Palate home">palate</button>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-act="tab" data-tab="me">Shelf</button>
      <button class="tab" data-act="tab" data-tab="friends">Friends</button>
      <button class="tab" data-act="tab" data-tab="recap">Recap</button>
    </nav>
    <button class="pill" data-act="add-shelf">Add shelf</button>
  </div>
</header>

<main id="view" class="wrap gutter"></main>

<footer class="wrap gutter">
  <div class="foot"><span id="acct"></span><button class="pill ghost" data-act="signout">Sign out</button></div>

</footer>

<nav class="bottom-nav" aria-label="Sections">

</nav>

const CATALOG = {};
function buildCatalog(){ for (const id in RAW) CATALOG[id] = RAW[id].trim().split('\n').map(l=>{const [n,s]=l.split('|');return {n:n.trim(),s:(s||'').trim()};}); }
buildCatalog();

function subOf(cat, n){ const f=(CATALOG[cat]||[]).find(i=>i.n===n); return f?f.s:''; }
function snap(cat, top, hm=[], why={}){ return {top: top.map(n=>({n,s:subOf(cat,n),why:why[n]||''})), hm: hm.map(n=>({n,s:subOf(cat,n),why:''}))}; }

/* ---------- Backend (Supabase) ---------- */
const CFG = window.PALATE_CONFIG || {};
const sb = (window.supabase && CFG.url && CFG.key && !/YOUR_/.test(CFG.url + CFG.key)) ? window.supabase.createClient(CFG.url, CFG.key) : null;
let me = null;                                   /* {id, name, invite} */
let state = {name:'', shelves:{}, order:[], vis:{}, photos:{}, custom:{}};
let FRIENDS = [], UPDATES = [], shared = {};      /* friends' shelves, activity, and their photos */
const KEY = 'palate-v3';
function applyCustom(){ for(const c in state.custom) for(const it of state.custom[c]) if(CATALOG[c] && !CATALOG[c].some(x=>x.n.toLowerCase()===it.n.toLowerCase())) CATALOG[c].push(it); }
const ui = {tab:'me', year:CURRENT, compare:null, view:'me'};
try{ const t=localStorage.getItem(KEY+'-tab'); if(t==='me'||t==='friends'||t==='recap') ui.tab=t; }catch(e){}

/* Saving: any change calls save(); a moment later only what changed is sent to Supabase. */
const synced = {shelves:{}, photos:{}, custom:'{}'};
let pushT=null, pushing=false, again=false;
function save(){ clearTimeout(pushT); pushT=setTimeout(push,700); return true; }
function shelfRow(c){ return {user_id:me.id, cat:c, years:state.shelves[c].years, vis:state.vis[c]||'friends', pos:Math.max(0,state.order.indexOf(c))}; }
function dropFile(url){ try{ const m=/\/photos\/(.+)$/.exec(url||''); if(m && sb) sb.storage.from('photos').remove([decodeURIComponent(m[1])]); }catch(e){} }
async function push(){
  if(!sb || !me) return;
  if(pushing){ again=true; return; }
  pushing=true;
  try{
    const up=[], del=[];
    for(const c of Object.keys(state.shelves)){ const r=shelfRow(c), j=JSON.stringify([r.years,r.vis,r.pos]); if(synced.shelves[c]!==j) up.push([c,r,j]); }
    for(const c of Object.keys(synced.shelves)) if(!state.shelves[c]) del.push(c);
    if(up.length){ const {error}=await sb.from('shelves').upsert(up.map(x=>x[1]),{onConflict:'user_id,cat'}); if(error) throw error; up.forEach(([c,,j])=>{synced.shelves[c]=j;}); }
    if(del.length){ const {error}=await sb.from('shelves').delete().eq('user_id',me.id).in('cat',del); if(error) throw error; del.forEach(c=>{delete synced.shelves[c];}); }
    const pu=[], pd=[];
    for(const k of Object.keys(state.photos)){ const p=state.photos[k], j=JSON.stringify(p); if(synced.photos[k]!==j){ const i=k.indexOf('|'); pu.push([k,j,{user_id:me.id,cat:k.slice(0,i),name:k.slice(i+1),url:p.src,h:p.h,s:p.s}]); } }
    for(const k of Object.keys(synced.photos)) if(!state.photos[k]) pd.push(k);
    if(pu.length){ const {error}=await sb.from('item_photos').upsert(pu.map(x=>x[2]),{onConflict:'user_id,cat,name'}); if(error) throw error; pu.forEach(([k,j])=>{synced.photos[k]=j;}); }
    for(const k of pd){ const i=k.indexOf('|'); const {error}=await sb.from('item_photos').delete().eq('user_id',me.id).eq('cat',k.slice(0,i)).eq('name',k.slice(i+1)); if(error) throw error; delete synced.photos[k]; }
    const cj=JSON.stringify(state.custom);
    if(cj!==synced.custom){ const {error}=await sb.from('user_settings').upsert({user_id:me.id,custom:state.custom},{onConflict:'user_id'}); if(error) throw error; synced.custom=cj; }
  }catch(e){ console.error(e); toast("Couldn't save. Check your connection."); setTimeout(()=>save(),6000); }
  finally{ pushing=false; if(again){ again=false; save(); } }
}
window.addEventListener('pagehide',()=>{ clearTimeout(pushT); push(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ clearTimeout(pushT); push(); } });

/* Friends: everything here is filtered by the database rules, so we only ever receive what we may see. */
function snapAt(years,y){ const ys=Object.keys(years||{}).map(Number).filter(v=>v<=y).sort((a,b)=>b-a); if(!ys.length) return null; const s=years[ys[0]]; return (!s||s.removed||!s.top||!s.top.length)?null:s; }
function ago(t){ const m=Math.max(1,Math.round((Date.now()-new Date(t))/60000)); if(m<60) return m+'m'; const h=Math.round(m/60); if(h<24) return h+'h'; return Math.round(h/24)+'d'; }
async function loadFriends(){
  const fr=await sb.from('friendships').select('friend_id,close').eq('user_id',me.id); if(fr.error) throw fr.error;
  const rows=fr.data||[], ids=rows.map(r=>r.friend_id);
  FRIENDS=[]; UPDATES=[]; shared={};
  if(!ids.length) return;
  const [pr,sh,ph]=await Promise.all([
    sb.from('profiles').select('id,name').in('id',ids),
    sb.from('shelves').select('user_id,cat,years,updated_at').in('user_id',ids),
    sb.from('item_photos').select('user_id,cat,name,url,h,s').in('user_id',ids)]);
  if(pr.error) throw pr.error; if(sh.error) throw sh.error; if(ph.error) throw ph.error;
  const closeOf=Object.fromEntries(rows.map(r=>[r.friend_id,r.close]));
  FRIENDS=(pr.data||[]).map(p=>({id:p.id,name:p.name,hue:hue(p.name),close:!!closeOf[p.id],shelves:{}}));
  const by=Object.fromEntries(FRIENDS.map(f=>[f.id,f])); const ups=[];
  for(const r of (sh.data||[])){ const f=by[r.user_id]; if(!f||!CAT[r.cat]) continue; const sn=snapAt(r.years,CURRENT); if(!sn) continue; f.shelves[r.cat]=sn; ups.push([f.id,r.cat,r.updated_at]); }
  FRIENDS.sort((a,b)=>a.name.localeCompare(b.name));
  ups.sort((a,b)=>new Date(b[2])-new Date(a[2]));
  UPDATES=ups.slice(0,6).map(([id,c,t])=>[id,`updated <b>${esc(CAT[c].name)}</b>`,ago(t)]);
  for(const p of (ph.data||[])) shared[pkey(p.cat,p.name)]={src:p.url,h:p.h||0,s:p.s||30};
}
const inviteLink = () => location.origin + location.pathname.replace(/index\.html$/,'') + '?join=' + (me?me.invite:'');

/* Sign in / sign up screens */
let authMode='in';
function captureJoin(){ try{ const c=new URLSearchParams(location.search).get('join'); if(c){ sessionStorage.setItem('palate-join',c); history.replaceState(null,'',location.pathname); } }catch(e){} }
const pendingJoin = () => { try{ return sessionStorage.getItem('palate-join'); }catch(e){ return null; } };
function showAuth(mode,msg){
  authMode=mode||authMode; document.body.classList.remove('in'); $('#sheet-root').innerHTML='';
  const up=authMode==='up';
  $('#view').innerHTML=`<section class="auth"><h1 class="logo">palate</h1><p class="tag">Your taste, ranked. Just for your friends.</p>
    ${pendingJoin()?'<div class="invited">You were invited by a friend. Make an account or sign in to connect.</div>':''}
    <form id="auth-form" novalidate>
      ${up?'<label>Your name<input id="au-name" autocomplete="name" maxlength="40" placeholder="What your friends call you"></label>':''}
      <label>Email<input id="au-email" type="email" autocomplete="email" inputmode="email"></label>
      <label>Password<input id="au-pass" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="${up?'At least 8 characters':''}"></label>
      <p class="auth-err" id="au-err" role="alert"></p>${msg?`<p class="auth-ok">${esc(msg)}</p>`:''}
      <button class="pill" type="submit">${up?'Create account':'Sign in'}</button>
    </form>
    <button class="swap" data-act="auth-mode">${up?'I already have an account':'New here? Create an account'}</button>
    <p class="muted" style="font-size:12px;margin:8px 0 0">build 2</p></section>`;
}
function showFatal(text,err){
  document.body.classList.remove('in');
  const why=err?[err.code,err.message,err.details,err.hint].filter(Boolean).join(' · '):'';

async function submitAuth(){

  const done=()=>{ clearTimeout(t); delete window[cb]; sc.remove(); }; const t=setTimeout(()=>{done();rej(new Error('timeout'));},8000);

async function wikiImage(c,n,sub){
  const cfg=IMG_SRC[c]||{}; await gate('wiki',120);
  const q=[n, cfg.sub?sub:'', cfg.w].filter(Boolean).join(' ');
  const j=await getJSON('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=0&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=400&pilicense=any&gsrsearch='+encodeURIComponent(q));
  const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>(a.index||99)-(b.index||99));
  const want=normT(n);
  const CORP=/^(inc|incorporated|corp|corporation|company|co|ltd|limited|llc|plc|group|sa|ag|gmbh)$/;   /* "Nike, Inc." counts as "Nike" */
  for(const pg of pages){ const t=normT(pg.title); if(!pg.thumbnail) continue;
    if(t===want || (t.startsWith(want+' ') && CORP.test(t.slice(want.length+1).split(' ')[0]))) return pg.thumbnail.source; }
  return null;
}
async function itunesImage(c,n,sub){
  const t=(IMG_SRC[c]||{}).i; if(!t) return null; await gate('itunes',3100);
  const artist=firstPart(sub), want=normT(n);
  const qs = t==='album'?{term:n+' '+artist,media:'music',entity:'album'} : t==='song'?{term:n+' '+artist,media:'music',entity:'song'}

  const j=await getJSON('https://itunes.apple.com/search?'+new URLSearchParams({...qs,limit:'8',country:'us'}),true);
  for(const r of (j.results||[])){
    const title = t==='album'?r.collectionName : t==='tv'?String(r.collectionName||'').replace(/[,:\-–]\s*(season|series)\s*\d+.*$/i,'') : r.trackName;
    if(normT(title)!==want) continue;
    if((t==='album'||t==='song') && artist && !normT(r.artistName).includes(normT(artist))) continue;
    const u=r.artworkUrl100||r.artworkUrl60; if(u) return u.replace(/\/\d+x\d+bb\./,'/600x600bb.').replace(/^http:/,'https:');
  }
  return null;
}
async function anilistImage(c,n){

  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({query:'query($s:String,$t:MediaType){Page(perPage:6){media(search:$s,type:$t,sort:SEARCH_MATCH){title{romaji english native}coverImage{large}}}}',variables:{s:n,t:type}})});
  if(!r.ok) throw new Error('http '+r.status);

  for(const m of list){ const ts=[m.title.english,m.title.romaji,m.title.native].map(normT); if(m.coverImage && ts.includes(want)) return m.coverImage.large; }

}
async function openLibImage(c,n,sub){

function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin='anonymous'; const t=setTimeout(()=>rej(new Error('timeout')),IMG_TIMEOUT);

function hueSat(d){ let x=0,y=0,w=0,sat=0; for(let i=0;i<d.length;i+=4){ const [h,s,l]=rgbToHsl(d[i],d[i+1],d[i+2]); const wt=s*(1-Math.abs(l-.5)*2)+.02; x+=Math.cos(h*Math.PI/180)*wt; y+=Math.sin(h*Math.PI/180)*wt; sat+=s*wt; w+=wt; }

async function sampleTint(url){

    try{ const im=await loadImg(src); const cv=document.createElement('canvas'); cv.width=cv.height=16; const cx=cv.getContext('2d'); cx.drawImage(im,0,0,16,16); return hueSat(cx.getImageData(0,0,16,16).data); }catch(e){}
  }

async function resolveOne(c,n){

const Q=[]; let running=0;
const stillShown=(c,n)=>[...document.querySelectorAll('.art[data-n]:not(.photo)')].some(el=>el.dataset.c===c&&el.dataset.n===n);
function pump(){ while(running<3 && Q.length){ const [c,n]=Q.shift(); if(!stillShown(c,n)){ AUTO.tried.delete(pkey(c,n)); continue; } running++; resolveOne(c,n).catch(()=>{}).finally(()=>{running--; pump();}); } }

let pointerDown=false, rerenderT=null;

    el.classList.add('photo'); el.style.backgroundImage=`url('${cssUrl(p.src)}')`; el.textContent=''; el.setAttribute('role','img'); el.setAttribute('aria-label',n); el.removeAttribute('aria-hidden'); } });

function hydrate(){

}

/* ---------- Shelf ---------- */
const shelfList = (y, view='me') => state.order.filter(c=>eff(c,y) && visibleIn(c,view));
function visTag(c){ const v=visOf(c); if(v==='friends') return ''; return `<span class="vis">${v==='private'?LOCK:PEOPLE}${v==='private'?'Only me':'Close'}</span>`; }

function meDyn(){

    <div class="controls">
      <div class="seg" role="group" aria-label="Preview your profile as">${[['me','Me'],['close','Close friends'],['friends','Friends']].map(([v,l])=>`<button data-act="view" data-v="${v}" aria-pressed="${ui.view===v}">${l}</button>`).join('')}</div>

function minYear(){ let m=CURRENT; for(const c in state.shelves) for(const y of Object.keys(state.shelves[c].years)) m=Math.min(m,+y); return m; }
function setYear(v){ ui.year=v; $('#year-out').textContent=v; $('#year').setAttribute('aria-valuetext',v); $('#count').textContent=`${shelfList(v).length} shelves · ${FRIENDS.length} friend${FRIENDS.length===1?'':'s'}`; $('#me-dyn').innerHTML=meDyn(); }

/* ---------- Friends ---------- */
function compat(f){
  const per=[];
  for(const c of Object.keys(f.shelves)){
    const e=eff(c,CURRENT); if(!e) continue;
    const a=e.snap.top, b=f.shelves[c].top; let sum=0; const shared=[];
    a.forEach((it,i)=>{ const j=b.findIndex(x=>x.n===it.n); if(j>=0){ sum+=((5-i)+(5-j))/2; shared.push(it.n);} });
    per.push({c,score:sum/15,shared});
  }
  return {pct: per.length ? Math.round(100*per.reduce((s,p)=>s+p.score,0)/per.length) : 0, per};
}
function invitePanel(){
  return `<div class="panel invite"><h2>Invite a friend</h2><p class="muted">Anyone with this link can add you as a friend, so only send it to people you trust.</p>
    <div class="link-row"><input readonly value="${esc(inviteLink())}" aria-label="Your invite link" onfocus="this.select()"><button class="pill sm" data-act="copy-invite">Copy</button></div>
    <button class="swap" data-act="new-invite">Make a new link</button></div>`;
}
function viewFriends(){
  if(ui.compare){ const f=FRIENDS.find(x=>x.id===ui.compare); if(f) return viewCompare(f); }
  const rows=FRIENDS.map(f=>({f,...compat(f)})).sort((a,b)=>b.pct-a.pct);
  const list = rows.length
    ? `<div class="panel">${rows.map(r=>`<button class="friend" data-act="compare" data-f="${r.f.id}">${av(r.f)}<div class="nm"><b>${esc(r.f.name)}${r.f.close?' <span class="muted" style="font-weight:500;font-size:13px">· close</span>':''}</b><span>${r.per.length} shelves in common</span></div><span class="pct">${r.pct}%</span></button>`).join('')}</div>`
    : `<div class="panel"><p class="empty-note">No friends yet. Send your link to someone and you will see how your tastes compare.</p></div>`;
  const lately = UPDATES.length ? `<div class="panel"><h2>Lately</h2><ul class="lately">${UPDATES.map(([id,txt,when])=>{const f=FRIENDS.find(x=>x.id===id);return f?`<li>${av(f,'s')}<p><b>${esc(first(f))}</b> ${txt} · ${when}</p></li>`:'';}).join('')}</ul></div>` : '';
  return `<section class="head"><h1>Friends</h1></section>
  <div class="friends">${list}<div>${invitePanel()}${lately?'<div style="height:12px"></div>'+lately:''}</div></div>`;
}
function mini(items,c,set){ return `<ol class="mini">${[0,1,2,3,4].map(i=>{const it=items[i]; return it?`<li class="${set.has(it.n)?'':'off'}"><span class="rk">${i+1}</span>${art(it.n,c,'sm')}<b>${esc(it.n)}</b></li>`:`<li class="off"><span class="rk">${i+1}</span><span></span><b>—</b></li>`;}).join('')}</ol>`; }
function viewCompare(f){
  const {pct,per}=compat(f);
  const sorted=[...per].sort((a,b)=>b.score-a.score);
  const theirsOnly=Object.keys(f.shelves).filter(c=>!eff(c,CURRENT));
  return `<section class="cmp-top"><button class="pill soft" data-act="back-friends" aria-label="Back to friends">←</button>
    <div class="pair">${meAv()}${av(f)}</div>
    <div><h1>You & ${esc(first(f))}</h1><p>${pct}% in common · highlighted picks are on both shelves</p></div></section>
  <div class="cmp-actions"><button class="pill soft sm" data-act="toggle-close" data-f="${f.id}">${f.close?'Close friend ✓':'Add to close friends'}</button><button class="pill ghost sm" data-act="remove-friend" data-f="${f.id}">Remove friend</button></div>
  ${sorted.length?'':`<p class="empty-note">No shelves in common yet. ${esc(first(f))} has not shared any with you, or you have not added the same categories.</p>`}
  <div class="cmp-grid">${sorted.map(p=>{ const set=new Set(p.shared); const top=f.shelves[p.c].top[0]; return `<article class="card" style="${tint(p.c,top.n)}">
    <div class="card-head"><h2>${esc(CAT[p.c].name)}</h2><span class="meta">${p.shared.length} shared</span></div>
    <div class="cols"><div><h3>You</h3>${mini(eff(p.c,CURRENT).snap.top,p.c,set)}</div><div><h3>${esc(first(f))}</h3>${mini(f.shelves[p.c].top,p.c,set)}</div></div>
    <div style="margin-top:6px"><button class="pill ghost sm" data-act="open-friend" data-f="${f.id}" data-cat="${p.c}">${esc(first(f))}'s notes →</button></div>
  </article>`;}).join('')}</div>
  ${theirsOnly.length?`<div class="only">${theirsOnly.map(c=>`<button class="chip" data-act="open-friend" data-f="${f.id}" data-cat="${c}">${esc(first(f))}'s ${esc(CAT[c].name.toLowerCase())}</button>`).join('')}</div>`:'<div style="height:32px"></div>'}`;
}

/* ---------- Recap ---------- */
function recapData(){
  const Y=CURRENT, list=shelfList(Y);
  let constant=null, shake=null; const newTops=[];
  for(const c of list){
    const s=eff(c,Y).snap, prevE=eff(c,Y-1);
    const years=Object.keys(state.shelves[c].years).map(Number).filter(v=>v<=Y).sort((a,b)=>a-b);
    let start=Y;
    for(let k=years.length-1;k>=0;k--){ const sn=state.shelves[c].years[years[k]]; if(!sn.removed && sn.top[0]?.n===s.top[0].n) start=years[k]; else break; }
    if(start<Y && (!constant || start<constant.start)) constant={c,start,item:s.top[0]};
    if(prevE && prevE.year<Y){
      const p=prevE.snap; const fresh=s.top.filter(it=>!p.top.some(x=>x.n===it.n));
      if(fresh.length && (!shake || fresh.length>shake.fresh.length)) shake={c,fresh};
      if(p.top[0] && p.top[0].n!==s.top[0].n) newTops.push({c,now:s.top[0],was:p.top[0]});
    }
  }
  const best = FRIENDS.map(f=>({f,...compat(f)})).sort((a,b)=>b.pct-a.pct)[0];
  return {list,constant,shake,newTops,best};
}
function story(style,title,body){ return `<article class="card story" style="${style}"><div class="tag">palate ${yy(CURRENT)}<span>${esc(state.name)}</span></div>${title?`<h2>${title}</h2>`:''}${body}</article>`; }
function viewRecap(){
  const d=recapData(), Y=CURRENT;
  const tops=d.list.slice(0,5).map(c=>({c,it:eff(c,Y).snap.top[0]}));
  const rowsOf = arr => `<ol class="rows">${arr.map((x,i)=>`<li class="row" style="grid-template-columns:18px 58px minmax(0,1fr)"><span class="rk">${i+1}</span>${art(x.n,x.c,'row')}<div class="nm"><b>${esc(x.n)}</b><span>${esc(x.s)}</span></div></li>`).join('')}</ol>`;
  const cards=[];
  if(tops.length) cards.push(story(tint(tops[0].c,tops[0].it.n),'Your number ones',rowsOf(tops.map(t=>({n:t.it.n,c:t.c,s:CAT[t.c].name})))));
  if(d.constant) cards.push(story(tint(d.constant.c,d.constant.item.n),'',`<div class="feature">${art(d.constant.item.n,d.constant.c,'lg')}<b>${esc(d.constant.item.n)}</b><span>#1 in ${esc(CAT[d.constant.c].name.toLowerCase())} since ${d.constant.start}</span></div>`));
  if(d.newTops.length) cards.push(story(tint(d.newTops[0].c,d.newTops[0].now.n),'New at #1',rowsOf(d.newTops.slice(0,5).map(n=>({n:n.now.n,c:n.c,s:`${CAT[n.c].name} · over ${n.was.n}`})))));
  if(d.shake) cards.push(story(tint(d.shake.c,d.shake.fresh[0].n),`New in ${esc(CAT[d.shake.c].name.toLowerCase())}`,rowsOf(d.shake.fresh.map(it=>({n:it.n,c:d.shake.c,s:it.s})))));
  if(d.best) cards.push(story(`--h:${d.best.f.hue}`,'',`<div class="feature"><span class="av" style="--h:${d.best.f.hue};width:120px;height:120px;font-size:40px">${esc(d.best.f.name.split(' ').map(p=>p[0]).join(''))}</span><b>${esc(d.best.f.name)}</b><span>Closest taste · ${d.best.pct}% in common</span></div>`));
  if(!cards.length) return `<section class="head"><h1>${Y} Recap</h1></section><p class="empty-note">Add a few shelves and your recap shows up here.</p>`;
  return `<section class="head"><h1>${Y} Recap</h1></section>
  <div class="stories">${cards.join('')}</div>
  <div class="recap-foot"><button class="pill" data-act="copy-share">Copy my #1s</button>${d.best?`<button class="pill soft" data-act="compare" data-f="${d.best.f.id}">Compare with ${esc(first(d.best.f))}</button>`:''}</div>`;
}

/* ---------- Sheets ---------- */
let lastFocus=null, ed=null, pk=null, sheetKind=null, detailArgs=null;
function sheet(html, kind){ const root=$('#sheet-root'); if(!root.firstChild) lastFocus=document.activeElement; sheetKind=kind; root.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; document.body.style.overflow='hidden'; }
function closeSheet(){ $('#sheet-root').innerHTML=''; document.body.style.overflow=''; ed=null; pk=null; sheetKind=null; try{lastFocus&&lastFocus.focus();}catch(e){} }
function frTags(c){ return it=>{ const sh=sharers(c,it.n); return (sh.length?`<div class="also-fr">${sh.map(x=>`<span class="fr-tag">${av(x.f)}${esc(first(x.f))} ${x.label}</span>`).join('')}</div>`:'') + (it.why?`<p class="why">${esc(it.why)}</p>`:''); }; }

function openDetail(c, fid){
  detailArgs=[c,fid];
  let s, prev=null, who, y, own=!fid;
  if(fid){ const f=FRIENDS.find(x=>x.id===fid); s=f.shelves[c]; who=first(f); y=CURRENT; }
  else { y=ui.year; s=eff(c,y).snap; prev=prevFor(c,y); who=state.name; }
  const editable = own && y===CURRENT && ui.view==='me';
  const extra = it => frTags(c)(it);
  const rows = s.top.map((it,i)=>`<li class="row"><span class="rk">${i+1}</span>${editable?photoBtn(c,it.n,'row'):art(it.n,c,'row')}<div class="nm"><b>${esc(it.n)}</b><span>${esc(it.s)}</span>${extra(it)}</div>${change(it,i,prev)}</li>`).join('');

  setTimeout(()=>$('.sheet .x')?.focus(),20);

/* Editor */
function openEditor(c, flow){
  const e=eff(c,CURRENT), s=e?e.snap:{top:[],hm:[]};
  const slots=Array(7).fill(null);
  s.top.forEach((it,i)=>slots[i]={...it}); s.hm.forEach((it,i)=>slots[5+i]={...it});
  ed={cat:c,slots,query:'',confirm:false,isNew:!e,res:[],flow:!!flow};
  renderEditor(); setTimeout(()=>$('#ed-q')?.focus(),30);
}
function hl(n,q){ const i=n.toLowerCase().indexOf(q); if(i<0) return esc(n); return esc(n.slice(0,i))+'<mark>'+esc(n.slice(i,i+q.length))+'</mark>'+esc(n.slice(i+q.length)); }
function resBtn(it,k,q,right){ return `<li><button type="button" class="res" data-act="pick" data-k="${k}">${art(it.n,ed.cat,'sm')}<div class="nm"><b>${q?hl(it.n,q):esc(it.n)}</b><span>${esc(it.s)}</span></div><span class="add">${right||''}Add</span></button></li>`; }
function results(){
  const raw=ed.query.trim(), q=raw.toLowerCase();
  const have=new Set(ed.slots.filter(Boolean).map(s=>s.n.toLowerCase()));
  const all=CATALOG[ed.cat]||[];
  if(!q){
    /* Suggestions for when you're blanking: friends' picks first, then what's popular */
    const fr={};
    FRIENDS.forEach(f=>{ const s=f.shelves[ed.cat]; if(!s) return; s.top.forEach(it=>{ if(have.has(it.n.toLowerCase())) return; (fr[it.n] ||= {it:{n:it.n,s:it.s},fs:[]}).fs.push(f); }); });
    const fl=Object.values(fr).sort((a,b)=>b.fs.length-a.fs.length).slice(0,5);
    const flNames=new Set(fl.map(x=>x.it.n));
    const pop=all.filter(it=>!have.has(it.n.toLowerCase()) && !flNames.has(it.n)).slice(0, fl.length?6:9);
    ed.res=[...fl.map(x=>x.it), ...pop];
    let k=0, html='';
    if(fl.length) html+=`<li class="sec">On your friends' shelves</li>`+fl.map(x=>resBtn(x.it,k++,'',`<span class="stack">${x.fs.map(f=>av(f)).join('')}</span>`)).join('');
    if(pop.length) html+=`<li class="sec">Popular</li>`+pop.map(it=>resBtn(it,k++,'')).join('');
    return html;
  }
  const m=all.filter(it=>!have.has(it.n.toLowerCase()) && (it.n.toLowerCase().includes(q)||it.s.toLowerCase().includes(q)));
  m.sort((a,b)=>(b.n.toLowerCase().startsWith(q))-(a.n.toLowerCase().startsWith(q)));
  ed.res=m.slice(0,7);
  const exact=all.some(it=>it.n.toLowerCase()===q) || have.has(q);
  return ed.res.map((it,k)=>resBtn(it,k,q)).join('')
    + (exact?'':`<li><button type="button" class="res" data-act="custom"><span class="plus">+</span><div class="nm"><b>Add “${esc(raw)}”</b><span>Not listed yet · you can add your own photo</span></div><span class="add">Add</span></button></li>`);
}
function slotRow(i){
  const it=ed.slots[i], label=i<5?String(i+1):'·';
  if(!it) return `<li class="slot empty dz-item" data-slot="${i}"><span class="rk">${label}</span><span>Empty</span></li>`;
  const p=photo(ed.cat,it.n);
  return `<li class="slot dz-item" data-slot="${i}"><span class="rk">${label}</span>${photoBtn(ed.cat,it.n,'row')}<div class="nm"><b>${esc(it.n)}</b><span>${esc(it.s)}</span>${p?`<button type="button" class="linkish" data-act="photo-rm" data-n="${esc(it.n)}">Remove photo</button>`:''}</div>
    <div class="ctl"><button type="button" class="ib" data-act="rm" data-i="${i}" aria-label="Remove ${esc(it.n)}">✕</button>${grip(it.n)}</div>
    ${i<5?`<textarea class="why-in" id="why-${i}" data-i="${i}" rows="1" aria-label="Why ${esc(it.n)}" placeholder="Why this one? (optional)">${esc(it.why||'')}</textarea>`:''}</li>`;
}
function nextCat(){ const free=c=>!eff(c.id,CURRENT) && c.id!==ed?.cat; return (CATS.find(c=>c.popular&&free(c))||CATS.find(free))?.id; }
function renderEditor(){
  const c=CAT[ed.cat];
  const left = ed.isNew ? '<span></span>' : ed.confirm
    ? `<div class="confirm">Remove for ${CURRENT}?<button class="pill soft danger sm" data-act="del-yes">Remove</button><button class="pill ghost sm" data-act="del-no">Keep</button></div>`
    : `<button class="pill ghost danger" data-act="del-ask">Remove shelf</button>`;
  const nx = (ed.flow || ed.isNew) ? nextCat() : null;
  sheet(`<div class="sheet-head"><div><h2>${esc(c.name)}</h2><p>${CURRENT}${ed.flow?' · quick start':''}</p></div><button class="x" data-act="close" aria-label="Close">✕</button></div>
    <div class="search"><input id="ed-q" type="search" autocomplete="off" aria-label="Search ${esc(c.name.toLowerCase())}" placeholder="Search ${esc(c.name.toLowerCase())}" value="${esc(ed.query)}"><ul id="ed-results" class="results">${results()}</ul></div>
    ${c.photo?`<p class="tipline">Tap any pick's image to use your own photo.</p>`:''}
    <div class="dz" data-dz="editor">
    <div class="label">Top 5 <span>Hold ⠿ and drag to reorder · tap an image to add a photo</span></div>
    <ol class="rows">${[0,1,2,3,4].map(slotRow).join('')}</ol>
    <div class="label">Honorable mentions</div>
    <ol class="rows">${[5,6].map(slotRow).join('')}</ol>
    </div>
    <div class="sheet-foot">${left}<div class="foot-right"><button class="pill soft" data-act="close">Cancel</button>${nx?`<button class="pill soft" data-act="save-next" data-next="${nx}">Save & next: ${esc(CAT[nx].name)}</button>`:''}<button class="pill" data-act="save">Save</button></div></div>`, 'editor');
}
function compact(){ const t=ed.slots.slice(0,5).filter(Boolean), h=ed.slots.slice(5).filter(Boolean); ed.slots=[...t,...Array(5-t.length).fill(null),...h,...Array(2-h.length).fill(null)]; }
function swap(a,b){ const s=ed.slots; [s[a],s[b]]=[s[b],s[a]]; compact(); renderEditor(); }
function move(i,dir){
  let t=i+dir; if(t<0||t>6) return;
  if(dir>0 && i<4 && !ed.slots[t]) t=5;
  if(dir<0 && i===5 && !ed.slots[4]) t=ed.slots.slice(0,5).filter(Boolean).length;
  swap(i,t);
}
function addItem(it){
  let k=ed.slots.findIndex((s,i)=>i<5&&!s); if(k<0) k=ed.slots.findIndex((s,i)=>i>=5&&!s);
  if(k<0){ toast('Full. Remove one first.'); return; }
  ed.slots[k]={n:it.n,s:it.s,why:''}; ed.query=''; renderEditor();
  setTimeout(()=>$('#ed-q')?.focus(),20);
}
function saveEditor(next){
  const top=ed.slots.slice(0,5).filter(Boolean).map(x=>({n:x.n,s:x.s,why:(x.why||'').trim()}));
  const hm=ed.slots.slice(5).filter(Boolean).map(x=>({n:x.n,s:x.s,why:''}));
  if(!top.length){ toast('Add at least one pick first.'); return; }
  const c=ed.cat, flow=ed.flow; (state.shelves[c] ||= {years:{}}).years[CURRENT]={top,hm};
  if(!state.order.includes(c)) state.order=[...state.order, c];
  save(); ui.tab='me'; ui.year=CURRENT; ui.view='me'; render();
  if(next){ openEditor(next, true); toast(`Saved ${CAT[c].name}`); } else { closeSheet(); toast('Saved'); }
}
function removeShelf(){
  const c=ed.cat, sh=state.shelves[c];
  if(Object.keys(sh.years).some(y=>+y!==CURRENT)) sh.years[CURRENT]={top:[],hm:[],removed:true};
  else { delete state.shelves[c]; state.order=state.order.filter(x=>x!==c); }
  save(); closeSheet(); render(); toast('Removed');
}

/* Photos: cropped square, downsized, and sampled for the card tint */
let pendingPhoto=null;
function rgbToHsl(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2; if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); h= mx===r?((g-b)/d+(g<b?6:0)) : mx===g?((b-r)/d+2) : ((r-g)/d+4); h*=60; } return [h,s,l]; }
function readPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      try{
        const S=300, cv=document.createElement('canvas'); cv.width=S; cv.height=S; const cx=cv.getContext('2d');
        const m=Math.min(img.naturalWidth,img.naturalHeight); cx.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,S,S);
        const src=cv.toDataURL('image/jpeg',.8);
        const t=document.createElement('canvas'); t.width=t.height=16; const tx=t.getContext('2d'); tx.drawImage(cv,0,0,16,16);
        const d=tx.getImageData(0,0,16,16).data; let x=0,y=0,w=0,sat=0;
        for(let i=0;i<d.length;i+=4){ const [h,s,l]=rgbToHsl(d[i],d[i+1],d[i+2]); const wt=s*(1-Math.abs(l-.5)*2)+.02; x+=Math.cos(h*Math.PI/180)*wt; y+=Math.sin(h*Math.PI/180)*wt; sat+=s*wt; w+=wt; }
        let h=Math.atan2(y,x)*180/Math.PI; if(h<0) h+=360;
        URL.revokeObjectURL(url); res({src,h:Math.round(h),s:Math.round(100*sat/w)});
      }catch(e){ rej(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src=url;
  });
}
function rerenderSheet(){ if(sheetKind==='editor' && ed) renderEditor(); else if(sheetKind==='detail' && detailArgs) openDetail(...detailArgs); }
$('#photo-input').addEventListener('change', async e=>{
  const file=e.target.files&&e.target.files[0]; e.target.value=''; if(!file||!pendingPhoto) return;
  const target=pendingPhoto; pendingPhoto=null;
  try{
    toast('Uploading photo…');
    const p=await readPhoto(file);
    const blob=await (await fetch(p.src)).blob();
    const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
    const path=`${me.id}/${id}.jpg`;
    const up=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
    if(up.error) throw up.error;
    const url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
    const k=pkey(target.c,target.n), old=state.photos[k];
    state.photos[k]={src:url,h:p.h,s:p.s}; if(old) dropFile(old.src);
    save(); render(); rerenderSheet(); toast('Photo added');
  }catch(err){ console.error(err); toast("Couldn't upload that photo. Try a JPG or PNG."); }
});

/* Category picker */
function pickerList(){
  const q=(pk.q||'').trim().toLowerCase();
  const btn=c=>`<button class="pk" data-act="pick-cat" data-cat="${c.id}" ${eff(c.id,CURRENT)?'disabled':''}>${esc(c.name)}</button>`;
  if(q){ const m=CATS.filter(c=>c.name.toLowerCase().includes(q)||c.group.toLowerCase().includes(q)); return m.length?`<div class="pk-group"><div class="pk-grid">${m.map(btn).join('')}</div></div>`:`<p class="muted" style="margin-top:16px">No match for “${esc(pk.q.trim())}”.</p>`; }
  const left=CATS.filter(c=>c.popular && !eff(c.id,CURRENT)).length;
  return (left?`<div class="quick"><div><b>Quick start</b><span>Go through the ${left} most popular shelves one after another, with suggestions.</span></div><button class="pill" data-act="quick">Start</button></div>`:'')
    + `<div class="pk-group"><h3>Popular</h3><div class="pk-grid">${CATS.filter(c=>c.popular).map(btn).join('')}</div></div>`
    + [...new Set(CATS.map(c=>c.group))].map(g=>`<div class="pk-group"><h3>${esc(g)}</h3><div class="pk-grid">${CATS.filter(c=>c.group===g).map(btn).join('')}</div></div>`).join('');
}
function openPicker(){
  pk={q:''};
  sheet(`<div class="sheet-head"><div><h2>New shelf</h2><p>${CATS.length} categories</p></div><button class="x" data-act="close" aria-label="Close">✕</button></div>
  <div class="search"><input id="pk-q" type="search" autocomplete="off" aria-label="Search categories" placeholder="Search categories"></div>
  <div id="pk-list">${pickerList()}</div><div style="height:22px"></div>`, 'picker');
  setTimeout(()=>$('#pk-q')?.focus(),30);
}

/* Arrange: order + who sees each shelf */
function openManage(){
  const list=shelfList(CURRENT);
  sheet(`<div class="sheet-head"><div><h2>Arrange shelves</h2><p>Order and who can see each one</p></div><button class="x" data-act="close" aria-label="Close">✕</button></div>
  <ol class="manage dz" data-dz="arrange">${list.map(c=>{ const top=eff(c,CURRENT).snap.top[0]; return `<li class="dz-item" data-cat="${c}">${grip(CAT[c].name)}${art(top.n,c,'sm')}<div class="nm"><b>${esc(CAT[c].name)}</b><span>#1 ${esc(top.n)}</span></div>
    <label class="vh" for="vis-${c}">Who sees ${esc(CAT[c].name)}</label><select id="vis-${c}" data-vis="${c}">${Object.entries(VIS).map(([k,l])=>`<option value="${k}" ${visOf(c)===k?'selected':''}>${l}</option>`).join('')}</select></li>`;}).join('')}</ol>
  <div class="sheet-foot"><span class="muted" style="font-size:13.5px">Hold ⠿ and drag. Preview with Me / Close friends / Friends.</span><div class="foot-right"><button class="pill" data-act="close">Done</button></div></div>`, 'manage');
}

/* Drag to reorder (mouse + touch). Arrow keys on a handle move it too. */
const GRIP_SVG='<svg viewBox="0 0 10 16" aria-hidden="true"><g fill="currentColor"><circle cx="2" cy="2" r="1.5"/><circle cx="8" cy="2" r="1.5"/><circle cx="2" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="2" cy="14" r="1.5"/><circle cx="8" cy="14" r="1.5"/></g></svg>';
function grip(label){ return `<button type="button" class="grip" aria-label="Drag to move ${esc(label)}. Arrow keys also move it.">${GRIP_SVG}</button>`; }
function commitDrop(zone){
  const items=[...zone.querySelectorAll('.dz-item')];
  if(zone.dataset.dz==='arrange'){
    const list=items.map(x=>x.dataset.cat); const rest=state.order.filter(x=>!list.includes(x));
    state.order=[...list,...rest]; save(); render();
  } else if(zone.dataset.dz==='editor' && ed){
    const old=ed.slots.slice(); ed.slots=items.map(x=>old[+x.dataset.slot]); compact(); renderEditor();
  }
}
document.addEventListener('pointerdown', e=>{
  const g=e.target.closest('.grip'); if(!g || e.button>0) return;
  const item=g.closest('.dz-item'), zone=g.closest('.dz'); if(!item||!zone) return;
  e.preventDefault();
  item.classList.add('lifting'); document.body.classList.add('dragging');
  const scroller=zone.closest('.sheet')||zone.closest('.sheet-body')||null;
  const grab=e.clientY-item.getBoundingClientRect().top; /* where on the row we grabbed it */
  let py=e.clientY, raf=0, done=false;
  const place=()=>{
    item.style.transform='';                       /* measure the row's natural slot */
    const h=item.offsetHeight; const base=item.getBoundingClientRect().top;
    let center=py-grab+h/2;
    for(let n=0;n<80;n++){                         /* keep swapping until it sits under the pointer */
      const pv=item.previousElementSibling, nx=item.nextElementSibling;
      if(pv && pv.classList.contains('dz-item')){ const r=pv.getBoundingClientRect(); if(center<r.top+r.height/2){ pv.before(item); continue; } }
      if(nx && nx.classList.contains('dz-item')){ const r=nx.getBoundingClientRect(); if(center>r.top+r.height/2){ nx.after(item); continue; } }
      break;
    }
    const nb=item.getBoundingClientRect().top;     /* natural top after any swaps */
    item.style.transform=`translateY(${py-grab-nb}px)`;  /* row follows the pointer freely */
  };
  const tick=()=>{
    if(done) return;
    if(scroller){ const sr=scroller.getBoundingClientRect(); let d=0;
      if(py<sr.top+60) d=-Math.ceil((sr.top+60-py)/4); else if(py>sr.bottom-90) d=Math.ceil((py-(sr.bottom-90))/4);
      if(d){ scroller.scrollTop+=Math.max(-24,Math.min(24,d)); place(); } }
    raf=requestAnimationFrame(tick);
  };
  const move=ev=>{ py=ev.clientY; place(); };
  const up=()=>{ done=true; cancelAnimationFrame(raf);
    document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
    item.style.transform=''; item.classList.remove('lifting'); document.body.classList.remove('dragging'); commitDrop(zone); };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
  place(); raf=requestAnimationFrame(tick);
});
document.addEventListener('keydown', e=>{
  const g=e.target.closest && e.target.closest('.grip'); if(!g || (e.key!=='ArrowUp' && e.key!=='ArrowDown')) return;
  e.preventDefault(); const item=g.closest('.dz-item'), zone=g.closest('.dz'); const all=[...zone.querySelectorAll('.dz-item')]; const i=all.indexOf(item);
  const t=all[i+(e.key==='ArrowUp'?-1:1)]; if(!t) return;
  if(e.key==='ArrowUp') t.before(item); else t.after(item);
  const cat=item.dataset.cat, slotPos=all.indexOf(t);
  commitDrop(zone);
  setTimeout(()=>{ const sel = cat ? `.dz-item[data-cat="${cat}"] .grip` : `.dz[data-dz="editor"] .dz-item:nth-of-type(1)`; const target = cat ? $(sel) : [...document.querySelectorAll('.dz[data-dz="editor"] .dz-item')][slotPos]?.querySelector('.grip'); target?.focus(); },0);
});

/* ---------- Render + events ---------- */
function render(){
  $('#view').innerHTML = ui.tab==='friends'?viewFriends():ui.tab==='recap'?viewRecap():viewMe();
  document.querySelectorAll('.tab[data-tab], .bottom-nav [data-tab]').forEach(b=>{ if(b.dataset.tab===ui.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  try{ localStorage.setItem(KEY+'-tab',ui.tab); }catch(e){}
}


document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='scrim'){ if(e.target===el) closeSheet(); return; }
  switch(a){
    case 'tab': ui.tab=el.dataset.tab; ui.compare=null; render(); window.scrollTo(0,0); break;
    case 'view': ui.view=el.dataset.v; render(); break;
    case 'open': openDetail(el.dataset.cat); break;
    case 'open-friend': openDetail(el.dataset.cat, el.dataset.f); break;
    case 'edit': openEditor(el.dataset.cat); break;
    case 'add-shelf': ui.view='me'; if(ui.tab==='me' && ui.year!==CURRENT) ui.year=CURRENT; if(ui.tab==='me') render(); openPicker(); break;
    case 'quick': { const c=CATS.find(x=>x.popular&&!eff(x.id,CURRENT)); if(c) openEditor(c.id,true); break; }
    case 'pick-cat': openEditor(el.dataset.cat); break;
    case 'manage': openManage(); break;
    case 'close': closeSheet(); break;
    case 'compare': ui.tab='friends'; ui.compare=el.dataset.f; render(); window.scrollTo(0,0); break;
    case 'back-friends': ui.compare=null; render(); break;
    case 'year-now': $('#year').value=CURRENT; setYear(CURRENT); break;
    case 'photo': pendingPhoto={c:el.dataset.cat,n:el.dataset.n}; $('#photo-input').click(); break;
    case 'photo-rm': { const k=pkey(ed.cat, el.dataset.n); if(state.photos[k]) dropFile(state.photos[k].src); delete state.photos[k]; save(); render(); renderEditor(); break; }
    case 'pick': { const it=ed.res[+el.dataset.k]; if(it) addItem(it); break; }
    case 'custom': { const n=ed.query.trim(); if(!n) break; const it={n,s:'Added by you'}; (state.custom[ed.cat] ||= []).push(it); CATALOG[ed.cat].push(it); save(); addItem(it); break; }
    case 'rm': ed.slots[+el.dataset.i]=null; compact(); renderEditor(); break;
    case 'save': saveEditor(); break;
    case 'save-next': saveEditor(el.dataset.next); break;
    case 'del-ask': ed.confirm=true; renderEditor(); break;
    case 'del-no': ed.confirm=false; renderEditor(); break;
    case 'del-yes': removeShelf(); break;
    case 'copy-share': {
      const txt=`My palate ${CURRENT}\n`+shelfList(CURRENT,'friends').map(c=>`${CAT[c].name}: ${eff(c,CURRENT).snap.top[0].n}`).join('\n');
      try{ navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>toast('Copy was blocked here')); }catch(err){ toast('Copy was blocked here'); }
      break; }
    case 'signout': sb.auth.signOut().finally(()=>location.reload()); break;
    case 'reload': location.reload(); break;
    case 'auth-mode': showAuth(authMode==='in'?'up':'in'); break;
    case 'copy-invite': { const link=inviteLink(); try{ navigator.clipboard.writeText(link).then(()=>toast('Link copied'),()=>{ el.closest('.invite').querySelector('input').select(); toast('Press copy on the selected link'); }); }catch(err){ toast('Press copy on the selected link'); } break; }
    case 'new-invite': sb.rpc('rotate_invite_code').then(r=>{ if(r.error){ toast("Couldn't make a new link"); return; } me.invite=r.data; render(); toast('New link made. The old one no longer works.'); }); break;
    case 'toggle-close': { const f=FRIENDS.find(x=>x.id===el.dataset.f); if(!f) break; const v=!f.close;
      sb.from('friendships').update({close:v}).eq('user_id',me.id).eq('friend_id',f.id).then(r=>{ if(r.error){ toast("Couldn't change that"); return; } f.close=v; render(); toast(v?`${first(f)} can now see your close-friends shelves`:`${first(f)} is no longer a close friend`); }); break; }
    case 'remove-friend': {
      if(el.dataset.armed!=='1'){ el.dataset.armed='1'; el.textContent='Tap again to remove'; setTimeout(()=>{ if(el.isConnected){ el.dataset.armed=''; el.textContent='Remove friend'; } },3000); break; }
      const f=FRIENDS.find(x=>x.id===el.dataset.f); if(!f) break;
      sb.rpc('remove_friend',{fid:f.id}).then(async r=>{ if(r.error){ toast("Couldn't remove that friend"); return; } ui.compare=null; await loadFriends(); render(); toast(`Removed ${first(f)}`); }); break; }
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset && t.dataset.vis){ state.vis[t.dataset.vis]=t.value; save(); render(); toast(`${CAT[t.dataset.vis].name}: ${VIS[t.value]}`); if(sheetKind==='detail') openDetail(...detailArgs); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && $('#sheet-root').firstChild){ closeSheet(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter' && e.target.id==='ed-q'){ e.preventDefault(); if(ed.res[0]) addItem(ed.res[0]); else if(ed.query.trim()) $('[data-act="custom"]')?.click(); }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='year') setYear(+t.value);
  else if(t.id==='ed-q'){ ed.query=t.value; $('#ed-results').innerHTML=results(); }
  else if(t.classList.contains('why-in')){ const s=ed.slots[+t.dataset.i]; if(s) s.why=t.value; }
  else if(t.id==='pk-q'){ pk.q=t.value; $('#pk-list').innerHTML=pickerList(); }
});

document.addEventListener('submit',e=>{ if(e.target.id==='auth-form'){ e.preventDefault(); submitAuth(); } });
(async function boot(){
  try{ if(new URLSearchParams(location.search).has('debug')) window.PALATE_DEBUG=true; }catch(e){}
  captureJoin();
  if(!sb){ document.body.classList.remove('in'); $('#view').innerHTML='<section class="auth"><h1 class="logo">palate</h1><p class="auth-err" style="min-height:0">Setup needed: open config.js and paste in your Supabase URL and publishable key.</p></section>'; return; }
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT' && me) location.reload(); });
  try{ const {data}=await sb.auth.getSession(); if(data.session) await enter(data.session.user); else showAuth('in'); }
  catch(e){ console.error(e); showAuth('in'); }
})();
})();
</script>
