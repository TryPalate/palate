/* Popular picks in every category are fetched quietly in the background, so they are already there when the picker opens. */
let warmed=false;
function warmPopular(){
  if(warmed || !me) return; warmed=true;
  const net=navigator.connection||{}; if(net.saveData) return;
  const slow=/(^|-)(2g|3g)$/.test(net.effectiveType||'') || net.type==='cellular';
  const PER=12, urls=[], missing=[];
  const take=(cats,find)=>{ for(const c of cats) for(const it of (CATALOG[c.id]||[]).slice(0,PER)){ const p=photo(c.id,it.n); if(p) urls.push(dispSrc(c.id,p.src)); else if(find) missing.push([c.id,it.n]); } };
  take(CATS.filter(c=>c.popular),true);             /* the categories everyone sees first */
  if(!slow) take(CATS.filter(c=>!c.popular&&isOpen(c.id)),false); /* the rest, only on Wi-Fi */
  const idle=f=>('requestIdleCallback' in window)?requestIdleCallback(f,{timeout:3000}):setTimeout(f,500);
  const uniq=[...new Set(urls)]; let i=0;
  const step=()=>idle(()=>{
    uniq.slice(i,i+8).forEach(u=>{ const im=new Image(); im.decoding='async'; im.src=u; }); i+=8;
    if(i<uniq.length) setTimeout(step,300); else findMissing();
  });
  /* Popular things nobody has looked up yet: find their pictures now, once, and share them with everyone. */

/* ---------- Moving around: screens slide, the back button and swipe-back work, and taps can give a small vibration ----------
   The browser history always mirrors where you are: your shelf, then a tab, then a friend's profile or comparison, then an open sheet.
   After anything changes, syncHistory() lines the history up with that list, so Back closes a sheet first, then steps back through
   screens, and Back from any tab lands on your shelf. */
const TABS = ['me','friends','recap'];
const NAV = {i:0, busy:false, want:false, edgeT:0, t:0, ready:false};
const reduceMotion = () => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };
const overlayOpen = () => !!(sty || WRAP.open || $('#sheet-root .scrim'));
function navStack(){
  const L=[{tab:'me',profile:null,compare:null}];
  if(ui.tab!=='me') L.push({tab:ui.tab,profile:null,compare:null});
  if(ui.tab==='friends' && ui.profile) L.push({tab:'friends',profile:ui.profile,compare:null});
  if(ui.tab==='friends' && ui.compare) L.push({tab:'friends',profile:ui.profile||null,compare:ui.compare});
  if(overlayOpen()) L.push({...L[L.length-1],ov:true});
  return L;
}
function syncHistory(){ if(!me || !NAV.ready || NAV.t) return; NAV.t=setTimeout(()=>{ NAV.t=0; reconcile(); },0); }
function reconcile(){
  if(NAV.busy){ NAV.want=true; return; }
  const L=navStack(), D=L.length-1, st=k=>({pl:1,i:k,ov:false,...L[k]});
  try{
    if(D<NAV.i){ NAV.busy=true; NAV.want=true; history.go(D-NAV.i); setTimeout(()=>{ if(NAV.busy){ NAV.busy=false; reconcile(); } },900); return; }
    history.replaceState(st(NAV.i),'');
    for(let k=NAV.i+1;k<=D;k++) history.pushState(st(k),'');
    NAV.i=D;
  }catch(e){}
}
function navInit(){ NAV.ready=true; try{ const s=history.state; NAV.i=(s&&s.pl)?(s.i|0):0; }catch(e){ NAV.i=0; } reconcile(); }
const depthOf = s => s.tab==='me'?0:s.compare?3:s.profile?2:1;
/* Go to a screen. It slides in from the right when you go forward or deeper, from the left when you go back. */
function navTo(next, opts={}){
  const from={tab:ui.tab,profile:ui.profile||null,compare:ui.compare||null};
  const to={tab:next.tab||ui.tab, profile:next.profile||null, compare:next.compare||null};
  if(from.tab===to.tab && from.profile===to.profile && from.compare===to.compare){ if(!opts.fromPop && !opts.quiet) window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'}); return; }
  let dir=opts.dir;
  if(dir===undefined) dir = from.tab!==to.tab && depthOf(from)<=1 && depthOf(to)<=1 ? Math.sign(TABS.indexOf(to.tab)-TABS.indexOf(from.tab)) : Math.sign(depthOf(to)-depthOf(from));
  Object.assign(ui,to);
  render(); window.scrollTo(0,0); slideView(dir);
  if(!opts.fromPop && !opts.quiet) haptic();
}
function slideView(dir){
  const v=$('#view'); if(!v || reduceMotion()) return;
  v.style.transition=''; v.style.transform=''; v.style.opacity='';
  v.classList.remove('v-r','v-l','v-up'); void v.offsetWidth;
  v.classList.add(dir>0?'v-r':dir<0?'v-l':'v-up');
  clearTimeout(slideView.t); slideView.t=setTimeout(()=>v.classList.remove('v-r','v-l','v-up'),560);
}
function goBack(){

  if(ui.compare) navTo({tab:'friends',profile:ui.profile}); else if(ui.profile) navTo({tab:'friends'}); else if(ui.tab!=='me') navTo({tab:'me'});
}
addEventListener('popstate',e=>{
  const s=(e.state&&e.state.pl)?e.state:{i:0,tab:'me',profile:null,compare:null};
  if(NAV.busy){ NAV.busy=false; NAV.i=s.i|0; if(NAV.want){ NAV.want=false; reconcile(); } return; }
  NAV.i=s.i|0;
  if(!me || !document.body.classList.contains('in')) return;
  if(sty){ closeStory(true); syncHistory(); return; }
  if(WRAP.open){ closeWrap(true); syncHistory(); return; }

  const native = Date.now()-NAV.edgeT<800;   /* Safari already animated its own edge swipe */
  navTo({tab:s.tab||'me',profile:s.profile,compare:s.compare},{fromPop:true,quiet:true,dir:native?0:undefined});

/* Swipe sideways to move between Shelf, Friends and Recap; on a friend's profile, swipe right to go back. */
(function swipes(){
  let s=null;
  const blocked = t => t.closest('input,textarea,select,.grip,.stories,.alt-grid,.pf-art,.seg,.years,[data-noswipe]');
  addEventListener('touchstart',e=>{
    if(e.touches.length!==1){ s=null; return; }
    const t=e.touches[0];
    if(t.clientX<24 || t.clientX>innerWidth-24){ NAV.edgeT=Date.now(); s=null; return; }   /* leave the screen edges to the browser */
    if(!me || !document.body.classList.contains('in') || $('#sheet-root .scrim') || sty || document.body.classList.contains('dragging') || blocked(e.target) || innerWidth>900){ s=null; return; }
    s={x:t.clientX,y:t.clientY,t:Date.now(),lock:0,dx:0};
  },{passive:true});
  addEventListener('touchmove',e=>{
    if(!s) return; const t=e.touches[0], dx=t.clientX-s.x, dy=t.clientY-s.y;
    if(!s.lock){ if(Math.abs(dx)<10 && Math.abs(dy)<10) return; s.lock=Math.abs(dx)>Math.abs(dy)*1.3?1:-1; }
    if(s.lock<0) return;
    const i=TABS.indexOf(ui.tab), sub=!!(ui.profile||ui.compare);
    const can = dx>0 ? (sub || i>0) : (!sub && i<TABS.length-1);
    s.dx = can ? dx : dx*.18;
    const v=$('#view'); if(v){ v.style.transition='none'; v.style.transform=`translate3d(${s.dx*.45}px,0,0)`; v.style.opacity=String(1-Math.min(.35,Math.abs(s.dx)/900)); }
  },{passive:true});
  const end=()=>{
    if(!s) return; const st=s; s=null; const v=$('#view'); if(!v || st.lock<1) return;
    const fast=Math.abs(st.dx)/Math.max(1,Date.now()-st.t)>.45, go=Math.abs(st.dx)>80 || (fast && Math.abs(st.dx)>30);
    const i=TABS.indexOf(ui.tab), sub=!!(ui.profile||ui.compare);
    if(go && st.dx>0 && sub){ v.style.transition=''; v.style.transform=''; v.style.opacity=''; haptic(); goBack(); return; }
    if(go && st.dx>0 && i>0){ v.style.transition=''; v.style.transform=''; v.style.opacity=''; navTo({tab:TABS[i-1]}); return; }
    if(go && st.dx<0 && !sub && i<TABS.length-1){ v.style.transition=''; v.style.transform=''; v.style.opacity=''; navTo({tab:TABS[i+1]}); return; }
    v.style.transition='transform .34s var(--ease-out),opacity .34s var(--ease-out)'; v.style.transform=''; v.style.opacity='';
    setTimeout(()=>{ v.style.transition=''; },360);

})();

  if(t.dataset && t.dataset.pref==='rerank'){ setPref('rerank',t.checked); haptic(); render(); return; }
  if(t.dataset && t.dataset.vis){ state.vis[t.dataset.vis]=t.value; save(); render(); toast(`${CAT[t.dataset.vis].name}: ${VIS[t.value]}`); if(sheetKind==='detail') openDetail(...detailArgs); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && sty){ closeStory(); return; }
  if(e.key==='Escape' && $('#sheet-root').firstChild){ closeSheet(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter' && e.target.id==='find-in'){ e.preventDefault(); findPerson(); }
  if(e.key==='Enter' && ['set-name','set-un','set-email','set-pw1'].includes(e.target.id)){ e.preventDefault(); ({'set-name':saveName,'set-un':saveUsername,'set-email':saveEmail,'set-pw1':savePassword})[e.target.id](); }
  if(e.key==='Enter' && e.target.id==='ed-q'){ e.preventDefault(); if(ed.res[0]) addItem(ed.res[0]); else if(ed.query.trim()) $('[data-act="custom"]')?.click(); }
});
document.addEventListener('toggle',e=>{ const d=e.target; if(d.classList&&d.classList.contains('pk-acc')&&pk){ (pk.open ||= new Set())[d.open?'add':'delete'](d.dataset.g); } },true);
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='year') setYear(+t.value);
  else if(t.id==='story-notes'){ if(sty){ sty.notes=t.checked; try{ localStorage.setItem('palate-story-notes',t.checked?'1':'0'); }catch(e){} renderStory(); } }
  else if(t.id==='wipe-in'){ $('#wipe-btn').disabled=t.value.trim()!=='WIPE'; }
  else if(t.id==='del-in'){ $('#del-btn').disabled=t.value.trim()!=='DELETE'; }
  else if(t.id==='set-un'){ checkUsername(); }
  else if(t.id==='ed-q'){ ed.query=t.value; queueLive(); $('#ed-results').innerHTML=results(); }
  else if(t.classList.contains('why-in')){ const s=ed.slots[+t.dataset.i]; if(s) s.why=t.value; }
  else if(t.id==='pk-q'){ pk.q=t.value; $('#pk-list').innerHTML=pickerList(); }
});

document.addEventListener('submit',e=>{ if(e.target.id==='auth-form'){ e.preventDefault(); submitAuth(); } else if(e.target.id==='rec-form'){ e.preventDefault(); submitRecovery(); } });
try{ if(new URLSearchParams(location.search).has('debug')) (window.__p ||= {}).dbg={REFINED,LIVE,FWC,matchScore,osa,tokHit,splitsOf,franchiseIn,qTokens,mergeLive,fitsShelf,cleanFranchise,wikiSlugs,get ed(){ return ed; }}; }catch(e){}
(async function boot(){
  try{ if(new URLSearchParams(location.search).has('debug')) window.PALATE_DEBUG=true; }catch(e){}
  captureJoin();
  if(!sb){ document.body.classList.remove('in'); $('#view').innerHTML='<section class="auth">'+LOGO_H1+'<p class="auth-err" style="min-height:0">Setup needed: open config.js and paste in your Supabase URL and publishable key.</p></section>'; return; }
  recovering=/type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT' && me) location.reload(); if(ev==='PASSWORD_RECOVERY'){ recovering=true; showRecovery(); } });
  try{ const {data}=await sb.auth.getSession(); if(recovering){ if(data.session) showRecovery(); else showAuth('in','That reset link expired. Request a new one.'); } else if(data.session) await enter(data.session.user); else showAuth(); }
  catch(e){ console.error(e); showAuth(); }
})();
})();
</script>
